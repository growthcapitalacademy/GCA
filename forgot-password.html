<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Growth Capital Academy</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            max-width: 500px;
            margin: 120px auto 40px;
            padding: 40px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 16px;
        }
        .auth-container h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .auth-container p.subtitle {
            color: #aaa;
            font-size: 15px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--gold);
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 14px;
            background: #111;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
        }
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--gold);
            color: #000;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2>Reset Password</h2>
        <p class="subtitle">Enter your email address and we'll send you a link to reset your password.</p>
        
        <form id="reset-form">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            <button type="submit" class="btn-submit">Send Reset Link</button>
        </form>

        <p id="message"></p>

        <p style="text-align: center; margin-top: 25px;">
            <a href="login.html" style="color: var(--gold);">Back to Login</a>
        </p>
    </div>

    <script type="module">
        import { supabase } from './supabaseClient.js';

        const form = document.getElementById('reset-form');
        const messageEl = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;

            messageEl.style.color = "#aaa";
            messageEl.innerText = "Sending reset link...";

            // Appel de la fonction Supabase pour réinitialiser le mot de passe
            const { error } = await supabase.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + '/update-password.html', // Page où l'utilisateur va choisir son nouveau mot de passe
            });

            if (error) {
                messageEl.style.color = "#ff4d4d";
                messageEl.innerText = "Error: " + error.message;
            } else {
                messageEl.style.color = "#4bb543";
                messageEl.innerText = "Check your email! A password reset link has been sent.";
            }
        });
    </script>
</body>
</html>
