<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Class - Growth Capital Academy</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .live-container {
            padding: 120px 20px 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .live-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        #jitsi-container {
            width: 100%;
            height: 75vh;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="GCA.png" alt="Growth Capital Academy" class="logo-img">
                <h1 class="hero-title">
                    <span class="line-gold">GROWTH CAPITAL</span>
                    <span class="line-white">ACADEMY</span>
                </h1>
            </a>
            <div class="nav-menu">
                <a href="index.html">Exit to Dashboard</a>
            </div>
        </div>
    </header>

    <div class="live-container">
        <div class="live-header-bar">
            <h2 id="class-title" style="color: var(--gold);">Live Trading Session</h2>
        </div>
        <!-- Espace vidéo Jitsi -->
        <div id="jitsi-container"></div>
    </div>

    <!-- Script officiel de Jitsi Meet -->
    <script src="https://8x8.vc/external_api.js"></script>
    <script type="module">
        import { supabase } from './js/supabaseClient.js';

        // Récupérer le paramètre du salon dans l'URL (ex: live.html?room=phase1)
        const urlParams = new URLSearchParams(window.location.search);
        const roomName = urlParams.get('room') || 'gca-general-room';

        // Identifier l'utilisateur connecté pour afficher son nom dans la visio
        const { data: { user } } = await supabase.auth.getUser();
        let displayName = "GCA Student";
        if (user) {
            displayName = user.email;
        }

        // Lancement de l'API Jitsi
        const domain = "8x8.vc";
        const options = {
            roomName: `vpaas-magic-cookie-gca-room-${roomName}`,
            width: "100%",
            height: "100%",
            parentNode: document.querySelector('#jitsi-container'),
            userInfo: {
                displayName: displayName
            },
            configOverwrite: {
                startWithAudioMuted: true,
                startWithVideoMuted: false
            }
        };

        const api = new JitsiMeetExternalAPI(domain, options);
    </script>
</body>
</html>
