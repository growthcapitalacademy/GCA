<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Growth Capital Academy</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            max-width: 450px;
            margin: 140px auto 60px;
            padding: 40px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
        }

        .auth-container h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 10px;
            text-align: center;
        }

        .auth-container h2 span {
            color: var(--gold);
        }

        .auth-container p {
            color: var(--text-muted);
            text-align: center;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            transition: var(--transition);
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--gold);
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background: var(--gold);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1rem;
            margin-top: 10px;
        }

        .auth-btn:hover {
            opacity: 0.9;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 500;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- ================= NAVBAR ================= -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="GCA.png" alt="Growth Capital Academy" class="logo-img">
                <h1 class="hero-title" style="font-size: inherit; margin: 0;">
                    <span class="line-gold">GROWTH CAPITAL</span>
                    <span class="line-white">ACADEMY</span>
                </h1>
            </a>

            <!-- Menu de navigation -->
            <nav class="nav-menu">
                <a href="index.html">Home</a>
                <a href="signup.html" style="color: var(--gold);">Sign Up</a>
            </nav>

            <!-- Bouton Hamburger avec l'ID menuToggle -->
            <button class="menu-toggle" id="menuToggle" aria-label="Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <!-- ================= LOGIN FORM ================= -->
    <main class="auth-container">
        <h2>WELCOME <span>BACK</span></h2>
        <p>Log in to access your dashboard and continue learning.</p>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Your password">
            </div>

            <button type="submit" class="auth-btn">LOG IN</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="signup.html">Sign up</a>
        </div>
    </main>

    <!-- ================= SCRIPT MOBILE MENU & SUPABASE ================= -->
    <script>
        /* ================= MOBILE MENU ================= */
        const menuButton = document.getElementById("menuToggle"); 
        const mobileMenu = document.querySelector(".nav-menu"); 

        if (menuButton && mobileMenu) {
            menuButton.addEventListener("click", () => {
                mobileMenu.classList.toggle("active");
            });

            /* Close mobile menu when clicking a link */
            mobileMenu.querySelectorAll("a").forEach(link => {
                link.addEventListener("click", () => {
                    mobileMenu.classList.remove("active");
                });
            });
        }
    </script>

    <script type="module">
        import { supabase } from './supabaseClient.js';

        const loginForm = document.getElementById('login-form');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                alert("Error: " + error.message);
            } else {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
