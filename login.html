<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Growth Capital Academy</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-section {
            padding: 180px 0 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
        }
        .login-card h2 {
            font-family: 'Playfair Display', serif;
            margin-bottom: 20px;
            color: var(--gold);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--gold);
            font-size: 0.9rem;
        }
        .login-card input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="GCA.png" alt="Growth Capital Academy" class="logo-img">
                <h1 class="hero-title">
                    <span class="line-gold">GROWTH CAPITAL</span>
                    <span class="line-white">ACADEMY</span>
                </h1>
            </a>
            <div class="nav-menu">
                <a href="index.html">Home</a>
            </div>
        </div>
    </header>

    <section class="login-section">
        <div class="login-card">
            <h2>Log In</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn btn-gold" style="width: 100%; padding: 12px; font-weight: bold; cursor: pointer;">Sign In</button>
            </form>
            <p id="error-message" style="color: #ef4444; margin-top: 15px; font-size: 0.9rem;"></p>
            <p style="text-align: center; margin-top: 20px; color: #aaa; font-size: 0.9rem;">
                Don't have an account? <a href="signup.html" style="color: var(--gold);">Sign up here</a>
            </p>
        </div>
    </section>

    <script type="module">
        import { supabase } from './supabaseClient.js';

        const form = document.getElementById('login-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('error-message').innerText = "";

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                document.getElementById('error-message').innerText = error.message;
            } else {

                alert("Login successful!"); 
                window.location.href = "dashboard.html";
            }
        });
    </script>
                
</body>
</html>
