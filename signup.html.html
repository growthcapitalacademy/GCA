<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Growth Capital Academy</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            max-width: 500px;
            margin: 120px auto 40px;
            padding: 30px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--gold);
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background: #111;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--gold);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2>Créer votre compte GCA</h2>
        <form id="signup-form">
            <div class="form-group">
                <label>Prénom</label>
                <input type="text" id="first_name" required>
            </div>
            <div class="form-group">
                <label>Nom</label>
                <input type="text" id="last_name" required>
            </div>
            <div class="form-group">
                <label>Pays</label>
                <input type="text" id="country" required>
            </div>
            <div class="form-group">
                <label>Numéro de téléphone</label>
                <input type="tel" id="phone" required>
            </div>
            <div class="form-group">
                <label>Adresse e-mail</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="password" required>
            </div>
            <div class="form-group">
                <label>Comment avez-vous entendu parler de nous ?</label>
                <select id="referral_source">
                    <option value="social_media">Réseaux sociaux</option>
                    <option value="friend">Par un ami / Bouche à oreille</option>
                    <option value="search">Recherche Google</option>
                    <option value="other">Autre</option>
                </select>
            </div>
            <button type="submit" class="btn-submit">S'inscrire</button>
        </form>
    </div>

    <script type="module">
        import { supabase } from './supabaseClient.js';

        const form = document.getElementById('signup-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const first_name = document.getElementById('first_name').value;
            const last_name = document.getElementById('last_name').value;
            const country = document.getElementById('country').value;
            const phone = document.getElementById('phone').value;
            const referral_source = document.getElementById('referral_source').value;

            // 1. Inscription Auth Supabase
            const { data, error } = await supabase.auth.signUp({
                email,
                password
            });

            if (error) {
                alert("Erreur lors de l'inscription : " + error.message);
                return;
            }

            if (data.user) {
                // 2. Enregistrement des détails dans la table profiles
                const { error: profileError } = await supabase.from('profiles').insert([
                    {
                        id: data.user.id,
                        first_name,
                        last_name,
                        country,
                        phone,
                        referral_source
                    }
                ]);

                if (profileError) {
                    alert("Erreur profil : " + profileError.message);
                } else {
                    alert("Inscription réussie ! Vous allez être redirigé vers la connexion.");
                    window.location.href = "login.html";
                }
            }
        });
    </script>
</body>
</html>
