<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Growth Capital Academy</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            max-width: 500px;
            margin: 120px auto 40px;
            padding: 30px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--gold);
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            background: #111;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--gold);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2>Log In to Growth Capital Academy</h2>
        <form id="login-form">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn-submit">Log In</button>
        </form>
        
        <p style="text-align: center; margin-top: 15px; color: #aaa;">
            Don't have an account? <a href="signup.html" style="color: var(--gold);">Sign up here</a>
        </p>
    </div>

    <script type="module">
        import { supabase } from './supabaseClient.js';

        const form = document.getElementById('login-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabase.auth.signInWithPassword({
                email,
                password,
            });

            if (error) {
                alert("Login error: " + error.message);
            } else {
                // Redirection vers le dashboard après connexion réussie
                window.location.href = "dashboard.html";
            }
        });
    </script>
</body>
</html>
