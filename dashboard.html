<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Dashboard - Growth Capital Academy</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-container {
            max-width: 900px;
            margin: 140px auto 40px;
            padding: 40px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
        }
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }
        .dashboard-header h2 {
            color: var(--gold);
            font-family: 'Playfair Display', serif;
        }
        .progress-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .btn-logout {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-logout:hover {
            background: var(--gold);
            color: #000;
        }
    </style>
</head>
<body>

    <!-- Barre de navigation du dashboard -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="GCA.png" alt="Growth Capital Academy" class="logo-img">
                <h1 class="hero-title">
                    <span class="line-gold">GROWTH CAPITAL</span>
                    <span class="line-white">ACADEMY</span>
                </h1>
            </a>
            <div class="nav-menu">
                <a href="index.html">Home</a>
                <button id="logout-btn" class="btn-logout">Log Out</button>
            </div>
        </div>
    </header>

    <!-- Contenu du Dashboard -->
    <div class="dashboard-container">
        <div class="dashboard-header">
            <div>
                <h2>Welcome back, <span id="user-name">Member</span>!</h2>
                <p style="color: #aaa; margin-top: 5px;">Access your live classes and track your financial growth journey.</p>
            </div>
        </div>

        <!-- Suivi de progression -->
        <div class="progress-box">
            <h3 style="color: var(--gold); margin-bottom: 10px;">Your Progress</h3>
            <p style="font-size: 1.2rem; font-weight: bold;">Completed Classes: <span id="progress-count" style="color: var(--gold);">0</span> / 10</p>
        </div>

        <!-- Accès au Live / Cours -->
        <div style="background: rgba(212, 175, 55, 0.05); border: 1px solid var(--gold); padding: 30px; border-radius: 12px; text-align: center;">
            <h3 style="color: var(--gold); margin-bottom: 15px;">Live Session Access</h3>
            <p style="margin-bottom: 20px; color: #ccc;">Your next live session is ready. Click below to enter the live classroom.</p>
            <a href="#" class="btn btn-gold" style="padding: 12px 30px; text-decoration: none; font-weight: bold; border-radius: 6px; display: inline-block;">Join Live Session</a>
        </div>
    </div>

    <!-- Script de protection de session, affichage du nom et déconnexion -->
    <script type="module">
        import { supabase } from './supabaseClient.js';

        // 1. Vérification de la session (Sécurité)
        const { data: { session }, error: sessionError } = await supabase.auth.getSession();
        if (!session || sessionError) {
            window.location.href = "login.html";
        } else {
            // 2. Récupération des données du profil (Nom, Prénom...)
            const user = session.user;
            const { data: profile, error } = await supabase
                .from('profiles')
                .select('first_name')
                .eq('id', user.id)
                .single();

            if (profile && profile.first_name) {
                document.getElementById('user-name').innerText = profile.first_name;
            } else {
                document.getElementById('user-name').innerText = user.email.split('@')[0];
            }
        }

        // 3. Gestion de la déconnexion avec message de confirmation
        const logoutBtn = document.getElementById('logout-btn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', async () => {
                const userConfirmed = confirm("Are you sure you want to log out?");
                if (userConfirmed) {
                    await supabase.auth.signOut();
                    alert("You have been successfully logged out.");
                    window.location.href = "login.html";
                }
            });
        }
    </script>
</body>
</html>
