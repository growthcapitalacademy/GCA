<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password - Growth Capital Academy</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            max-width: 450px;
            margin: 140px auto 60px;
            padding: 40px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
        }

        .auth-container h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 10px;
            text-align: center;
        }

        .auth-container h2 span {
            color: var(--gold);
        }

        .auth-container p {
            color: var(--text-muted);
            text-align: center;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            transition: var(--transition);
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--gold);
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background: var(--gold);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1rem;
            margin-top: 10px;
        }

        .auth-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- ================= NAVBAR ================= -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="GCA.png" alt="Growth Capital Academy" class="logo-img">
                <h1 class="hero-title" style="font-size: inherit; margin: 0;">
                    <span class="line-gold">GROWTH CAPITAL</span>
                    <span class="line-white">ACADEMY</span>
                </h1>
            </a>
        </div>
    </header>

    <!-- ================= UPDATE PASSWORD FORM ================= -->
    <main class="auth-container">
        <h2>NEW <span>PASSWORD</span></h2>
        <p>Enter your new secure password below.</p>

        <form id="update-password-form">
            <div class="form-group">
                <label for="new-password">New Password</label>
                <input type="password" id="new-password" required placeholder="At least 6 characters">
            </div>

            <button type="submit" class="auth-btn">UPDATE PASSWORD</button>
        </form>
    </main>

    <!-- ================= SCRIPT SUPABASE ================= -->
    <script type="module">
        import { supabase } from './supabaseClient.js';

        const updateForm = document.getElementById('update-password-form');

        updateForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;

            // Met à jour le mot de passe de l'utilisateur connecté via le lien magique
            const { data, error } = await supabase.auth.updateUser({
                password: newPassword
            });

            if (error) {
                alert("Error: " + error.message);
            } else {
                alert("Password updated successfully! You can now log in.");
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
